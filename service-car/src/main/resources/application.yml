server:
  port: 8082

spring:
  application:
    name: SERVICE-CAR
  datasource:
    url: jdbc:h2:mem:carservicedb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

client:
  service:
    name: SERVICE-CLIENT
    path: /api/clients
    timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.netflix.discovery: WARN
    com.example.car.services: INFO